name: Publish to NuGet

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for NuGet Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: windows-latest
    environment: nuget-publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore GeoView.Wpf/GeoView.Wpf.csproj

      - name: Build
        run: dotnet build GeoView.Wpf/GeoView.Wpf.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack GeoView.Wpf/GeoView.Wpf.csproj --configuration Release --no-build --output ./nupkg-out

      # Exchanges the GitHub OIDC token for a short-lived NuGet.org API key,
      # based on the Trusted Publishing policy configured on nuget.org for this repo/workflow.
      - name: NuGet Trusted Publishing login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          nuget-api-url: https://api.nuget.org

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nupkg-out/*.nupkg `
            --source https://api.nuget.org/v3/index.json `
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
            --skip-duplicate
